<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprendo a dividir con el Profesor Carlos Huancaya Matos</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e8f7ff,#fff3d9);font-family:system-ui,Arial,sans-serif;color:#243963;text-align:center}.wrap{max-width:780px;margin:22px auto;padding:18px}.panel{background:white;border-radius:25px;padding:20px 12px;box-shadow:0 10px 30px #24396320}h1{font-size:clamp(23px,4vw,35px);margin:4px 0 10px}.sub{font-size:19px}.status{display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px;font-weight:800;font-size:19px;margin:15px}.bar{height:14px;background:#e7e9f6;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#59c98c;width:0%;transition:width .4s}.board{position:relative;width:min(100%,540px);aspect-ratio:540/455;margin:14px auto 0;background:#fff;border-radius:15px;overflow:hidden}.digit{position:absolute;font-size:clamp(32px,10vw,74px);font-weight:900;line-height:1;color:#243963;transform:translate(-50%,-50%)}.line{position:absolute;background:#243963;border-radius:2px}.minus{position:absolute;color:#ef5d81;font-size:clamp(24px,7vw,45px);font-weight:900;transform:translate(-50%,-50%)}.cell{position:absolute;width:12.5%;height:16%;border:3px solid #8ab5ff;background:#f2f8ff;border-radius:15px;font-size:clamp(24px,6vw,43px);font-weight:900;color:#243963;text-align:center;outline:none;padding:0;transform:translate(-50%,-50%)}.cell:focus{border-color:#7851d4;box-shadow:0 0 0 3px #7851d42a}.cell.bad{border-color:#e54863;background:#fff0f2}.cell.good{border-color:#35b87b;background:#f1fff7}.btn{background:#7851d4;color:white;border:0;border-radius:18px;padding:17px 36px;font-size:22px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.message{font-size:23px;font-weight:800;min-height:36px;margin:12px}.help{display:none;margin:12px auto;max-width:580px;padding:15px;background:#fff4ce;border-radius:15px;font-size:18px;text-align:left;line-height:1.5}.help.show{display:block}.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:#ffffffbd;pointer-events:none}.overlay.show{display:flex}.emoji{font-size:110px}.overlay p{font-size:34px;font-weight:900;color:#243963}.confetti{position:fixed;top:-20px;width:11px;height:17px;z-index:40;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(950deg)}}@media(max-width:520px){.wrap{padding:7px}.panel{padding:13px 5px}.board{width:100%}.cell{border-width:2px;border-radius:9px}.status{font-size:15px}}
</style></head><body><main class="wrap"><section class="panel"><h1>🌈 ¡Aprendo a dividir!</h1><div class="sub">Con el Profesor Carlos Huancaya Matos</div><div class="status"><span id="counter">Ejercicio 1 de 40</span><span id="score">⭐ Aciertos: 0</span></div><div class="bar"><div id="progress"></div></div><div class="board" id="board" aria-label="División vertical con casillas para el procedimiento"></div><div class="message" id="message">¡Tú puedes! 💪</div><button class="btn" id="check">✓ COMPROBAR</button><div class="help" id="help"></div></section></main><div class="overlay" id="overlay"><div class="emoji" id="emoji"></div><p id="overlaytext"></p></div><script>
const board=document.getElementById('board'),check=document.getElementById('check'),message=document.getElementById('message'),help=document.getElementById('help'),overlay=document.getElementById('overlay');
// Se eligen 40 operaciones exactas con cociente de dos cifras y divisor de una cifra.
let pool=[];for(let divisor=2;divisor<=8;divisor++)for(let cociente=11;cociente<=49;cociente++){let dividendo=divisor*cociente;if(dividendo>99)continue;let dec=Math.floor(dividendo/10),q1=Math.floor(dec/divisor);if(q1===0)continue;pool.push({dividendo,divisor,cociente})}
for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const exercises=pool.slice(0,40);let idx=0,score=0,busy=false,inputs=[];
function el(tag,cls,x,y,w,h,txt){let e=document.createElement(tag);e.className=cls;if(x!=null)e.style.left=x+'%';if(y!=null)e.style.top=y+'%';if(w!=null)e.style.width=w+'%';if(h!=null)e.style.height=h+'%';if(txt!=null)e.textContent=txt;board.append(e);return e}
function cell(x,y,expected,label){let e=el('input','cell',x,y);e.type='text';e.inputMode='numeric';e.maxLength=1;e.autocomplete='off';e.setAttribute('aria-label',label);e.dataset.expected=String(expected);e.addEventListener('input',()=>{e.value=e.value.replace(/\D/g,'').slice(0,1);e.classList.remove('bad');if(e.value&&inputs.indexOf(e)<inputs.length-1)inputs[inputs.indexOf(e)+1].focus()});e.addEventListener('keydown',ev=>{if(ev.key==='Backspace'&&!e.value&&inputs.indexOf(e)>0)inputs[inputs.indexOf(e)-1].focus();if(ev.key==='Enter')check.click()});inputs.push(e);return e}
function load(){busy=false;check.disabled=false;overlay.classList.remove('show');message.textContent='¡Tú puedes! 💪';help.classList.remove('show');help.textContent='';board.innerHTML='';inputs=[];document.getElementById('counter').textContent=`Ejercicio ${idx+1} de 40`;document.getElementById('score').textContent=`⭐ Aciertos: ${score}`;document.getElementById('progress').style.width=(idx/40*100)+'%';let o=exercises[idx],a=Math.floor(o.dividendo/10),b=o.dividendo%10,d=o.divisor,q1=Math.floor(a/d),q2=o.cociente%10,p1=q1*d,r=a-p1,partial=r*10+b,p2=q2*d;
// Posiciones proporcionales a la imagen proporcionada: dividendo a la izquierda, divisor y cociente a la derecha.
el('div','digit',18,15,null,null,a);el('div','digit',32,15,null,null,b);el('div','digit',68,15,null,null,d);el('div','line',40,1,1.2,47);el('div','line',41,25,45,1.5);
// Primera resta, dividendo parcial y segunda resta.
el('div','minus',7,36,null,null,'−');cell(22,36,p1,'Primer producto a restar');el('div','line',14,47,24,1.1);
cell(52,36,q1,'Primera cifra del cociente');cell(68,36,q2,'Segunda cifra del cociente');
cell(19,57,Math.floor(partial/10),'Decenas del número parcial');cell(33,57,partial%10,'Unidades del número parcial');
el('div','minus',7,76,null,null,'−');cell(19,76,Math.floor(p2/10),'Decenas del segundo producto');cell(33,76,p2%10,'Unidades del segundo producto');el('div','line',3,87,36,1.1);cell(33,95,0,'Residuo final');
board.dataset.help=`${o.dividendo} ÷ ${d} = ${o.cociente}. Primero: ${a} ÷ ${d} = ${q1}; ${q1} × ${d} = ${p1}; ${a} − ${p1} = ${r}. Baja el ${b}: se forma ${partial}. Luego: ${partial} ÷ ${d} = ${q2}; ${q2} × ${d} = ${p2}; ${partial} − ${p2} = 0. La división es exacta.`;inputs[0].focus()}
function confetti(){let colors=['#ef5d81','#7851d4','#32c7a6','#ffc444','#55a8ff'];for(let i=0;i<140;i++){let c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*.7+'s';c.style.animationDuration=2.2+Math.random()*.8+'s';document.body.append(c);setTimeout(()=>c.remove(),3500)}}
check.addEventListener('click',()=>{if(busy)return;let valid=inputs.every(e=>e.value!==''&&Number(e.value)===Number(e.dataset.expected));inputs.forEach(e=>{e.classList.remove('good','bad');e.classList.add(e.value!==''&&Number(e.value)===Number(e.dataset.expected)?'good':'bad')});busy=true;check.disabled=true;overlay.classList.add('show');if(valid){score++;document.getElementById('score').textContent=`⭐ Aciertos: ${score}`;document.getElementById('emoji').textContent='🎉';document.getElementById('overlaytext').textContent='¡Muy bien!';confetti();setTimeout(()=>{idx++;if(idx===40){overlay.classList.remove('show');board.innerHTML='';message.textContent=`🏆 ¡Terminaste! ${score} de 40 ejercicios correctos.`;document.getElementById('counter').textContent='¡Juego completado!';document.getElementById('progress').style.width='100%';check.textContent='🔄 JUGAR DE NUEVO';check.disabled=false;check.onclick=()=>location.reload()}else load()},3000)}else{document.getElementById('emoji').textContent='😢';document.getElementById('overlaytext').textContent='¡Inténtalo otra vez!';setTimeout(()=>{overlay.classList.remove('show');help.textContent='📚 Guía: '+board.dataset.help;help.classList.add('show');message.textContent='Revisa las casillas rojas y vuelve a intentar.';busy=false;check.disabled=false;let first=inputs.find(e=>e.classList.contains('bad'));if(first){first.focus();first.select()}},3000)}});load();
</script></body></html>
